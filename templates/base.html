{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}HopeConnect{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <!-- ==========================
         Navigation Bar
    =========================== -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm">

        <div class="container">

            <a class="navbar-brand fw-bold" href="{% url 'home' %}">
                HopeConnect
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}"
                            href="{% url 'home' %}">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'about' %}active{% endif %}"
                            href="{% url 'about' %}">
                            About
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'services' %}active{% endif %}"
                            href="{% url 'services' %}">
                            Services
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'contact' %}active{% endif %}"
                            href="{% url 'contact' %}">
                            Contact
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- ==========================
         Main Content
    =========================== -->
    <main class="container mt-4">

        {% block content %}
        {% endblock %}

    </main>

    <!-- ==========================
         Footer
    =========================== -->
    <footer class="bg-success text-white py-4 mt-5">

        <div class="container text-center">

            <h5 class="fw-bold">
                HopeConnect
            </h5>

            <p class="mb-1">
                Donating Hope, Delivering Smiles.
            </p>

            <small>
                &copy; 2026 HopeConnect. All Rights Reserved.
            </small>

        </div>

    </footer>

    <!-- ==========================
         Back to Top Button
    =========================== -->
    <button id="topBtn" title="Go to Top" onclick="topFunction()">
        ↑
    </button>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Back to Top Script -->
    <script>

        const topBtn = document.getElementById("topBtn");

        window.onscroll = function () {

            if (document.body.scrollTop > 100 || document.documentElement.scrollTop > 100) {

                topBtn.style.display = "block";

            } else {

                topBtn.style.display = "none";

            }

        };

        function topFunction() {

            window.scrollTo({

                top: 0,
                behavior: "smooth"

            });

        }

    </script>

</body>

</html>
