<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" width="44" height="44" fill="none">
  <defs>
    <linearGradient id="hc-logo-bg" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#39A46B" />
      <stop offset="100%" stop-color="#1E653C" />
    </linearGradient>
    <linearGradient id="hc-heart-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="hc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0E3922" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Container Squircle with Soft Bevel -->
  <rect width="44" height="44" rx="11" fill="url(#hc-logo-bg)" />
  <rect x="0.75" y="0.75" width="42.5" height="42.5" rx="10.25" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Care / Donation Box Foundation -->
  <g filter="url(#hc-glow)">
    <path d="M12 21.5L22 26L32 21.5M12 21.5L22 17L32 21.5M12 21.5V29L22 33.5L32 29V21.5" 
          stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M22 26V33.5" 
          stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" />
  </g>

  <!-- Rising Heart of Hope (Golden Amber) -->
  <path d="M22 8.8C20.5 6.6 17.4 6.6 15.8 8.5C14.2 10.4 14.6 13.2 16.8 15.6L22 20.3L27.2 15.6C29.4 13.2 29.8 10.4 28.2 8.5C26.6 6.6 23.5 6.6 22 8.8Z" 
        fill="url(#hc-heart-gold)" />

  <!-- Radiant Light Accents -->
  <circle cx="12.5" cy="11.5" r="1.3" fill="#FDE68A" />
  <circle cx="31.5" cy="11.5" r="1.3" fill="#FDE68A" />
</svg>
